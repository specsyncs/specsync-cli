name: 'SpecSync Express OpenAPI Drift Check'
description: 'Zero-runtime static Express-to-OpenAPI drift detector. Catch undocumented, stale, and mismatched routes before they ship.'
author: 'Nikhil Verma'
branding:
  icon: 'check-circle'
  color: 'blue'

inputs:
  openapi:
    description: 'Path to OpenAPI specification file (e.g. openapi.yaml)'
    required: false
  source:
    description: 'Source glob patterns or directories (comma-separated, e.g. "src/**/*.ts")'
    required: false
  config:
    description: 'Path to specsync configuration file (e.g. specsync.json)'
    required: false
  base-path:
    description: 'API base path prefix (e.g. /api/v1)'
    required: false
  fail-on:
    description: 'Drift level that triggers failure: error | warning | never'
    required: false
    default: 'error'
  quiet:
    description: 'Suppress terminal output and only use exit code'
    required: false
    default: 'false'
  args:
    description: 'Additional CLI arguments to pass to specsync check'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Run SpecSync Drift Check
      shell: bash
      run: |
        CMD="npx --yes @specsyncs/cli@next check"
        if [ -n "${{ inputs.config }}" ]; then
          CMD="$CMD --config '${{ inputs.config }}'"
        fi
        if [ -n "${{ inputs.openapi }}" ]; then
          CMD="$CMD --openapi '${{ inputs.openapi }}'"
        fi
        if [ -n "${{ inputs.source }}" ]; then
          CMD="$CMD --source '${{ inputs.source }}'"
        fi
        if [ -n "${{ inputs.base-path }}" ]; then
          CMD="$CMD --base-path '${{ inputs.base-path }}'"
        fi
        if [ -n "${{ inputs.fail-on }}" ]; then
          CMD="$CMD --fail-on '${{ inputs.fail-on }}'"
        fi
        if [ "${{ inputs.quiet }}" = "true" ]; then
          CMD="$CMD --quiet"
        fi
        if [ -n "${{ inputs.args }}" ]; then
          CMD="$CMD ${{ inputs.args }}"
        fi
        eval "$CMD"
