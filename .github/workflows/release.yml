name: Release & Publish

on:
  release:
    types: [published]

concurrency:
  group: npm-release-${{ github.ref }}

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Production Bundle Build
        run: npm run build

      - name: Run Pack Smoke Test
        run: npm run pack:smoke

      - name: Check npm for the Release Version
        id: registry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const { GITHUB_OUTPUT, RELEASE_TAG } = process.env;
          if (RELEASE_TAG !== version && RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag ${RELEASE_TAG} does not match package.json version ${version}.`);
          }

          const url = `https://registry.npmjs.org/${encodeURIComponent(name)}/${encodeURIComponent(version)}`;
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) });
          if (response.status === 404) {
            appendFileSync(GITHUB_OUTPUT, 'publish=true\n');
          } else if (response.ok) {
            const published = await response.json();
            if (published.name !== name || published.version !== version) {
              throw new Error(`Unexpected npm registry response for ${name}@${version}.`);
            }
            console.log(`${name}@${version} is already published. npm upload skipped.`);
            appendFileSync(GITHUB_OUTPUT, 'publish=false\n');
          } else {
            throw new Error(`npm registry lookup for ${name}@${version} failed with HTTP ${response.status}.`);
          }
          NODE

      - name: Publish to npm
        if: steps.registry.outputs.publish == 'true'
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          publish_args=(--access public --provenance)
          if [[ "$PRERELEASE" == 'true' ]]; then
            publish_args+=(--tag next)
          fi
          npm publish "${publish_args[@]}"
