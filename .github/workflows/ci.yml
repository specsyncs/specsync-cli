name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.x', '24.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm run test:ci

      - name: Production Bundle Build
        run: npm run build

      - name: Verify Package Dry-Run
        run: npm run pack:dry

      - name: Run Pack Smoke Test
        run: npm run pack:smoke

      - name: Self-Check CLI Binary Execution
        run: node dist/cli.js check --config tests/fixtures/scenarios/all-match/specsync.json

  runtime:
    name: Packed CLI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18.x', '20.x']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Node.js 24 for Packaging
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Build and Pack CLI
        run: |
          npm ci
          pack_dir="$RUNNER_TEMP/specsync-runtime"
          mkdir -p "$pack_dir"
          npm pack --pack-destination "$pack_dir"
          echo "PACK_DIR=$pack_dir" >> "$GITHUB_ENV"

      - name: Set Up Node.js ${{ matrix.node-version }} for Runtime Check
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install and Run Packed CLI
        run: |
          npm install --prefix "$PACK_DIR" --no-audit --no-fund "$PACK_DIR"/*.tgz
          "$PACK_DIR/node_modules/.bin/specsync" check --config tests/fixtures/scenarios/all-match/specsync.json
